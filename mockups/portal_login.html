<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hillman Wi-Fi · Sign in</title>
  <link rel="stylesheet" href="mockup-styles.css">
</head>
<body>
  <div class="page-narrow">
    <div style="text-align:center;margin-bottom:32px">
      <div style="display:inline-grid;place-items:center;width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#2563eb,#6366f1);color:#fff;font-size:1.4em;font-weight:700;margin-bottom:16px">H</div>
      <h1 style="font-size:1.5em;margin:0 0 6px;font-weight:650">Hillman Wi-Fi</h1>
      <p class="muted" style="margin:0">Sign in to register this device</p>
    </div>

    <div class="card">
      <div class="card-body">
        <form>
          <label class="field">School email
            <input type="email" placeholder="you@hillmanschools.com" autocomplete="email">
          </label>
          <button type="submit" class="btn btn-primary btn-block">Email me a sign-in code</button>
        </form>

        <p class="muted" style="text-align:center;font-size:0.85em;margin:18px 0 0">
          We'll send a 6-digit code and a sign-in link.
        </p>
      </div>
    </div>

    <p class="muted" style="text-align:center;font-size:0.85em;margin-top:24px">
      Need help? Contact <a href="mailto:it@hillmanschools.com">it@hillmanschools.com</a>
    </p>
  </div>
</body>
</html>
