<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hillman Wi-Fi · Waiting for approval</title>
  <link rel="stylesheet" href="mockup-styles.css">
</head>
<body>
  <div class="page-narrow">
    <div style="text-align:center;margin-bottom:24px">
      <div style="display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--warning-bg);color:var(--warning);font-size:1.8em;margin-bottom:12px">⏳</div>
      <h1 style="font-size:1.4em;margin:0 0 6px;font-weight:650">Request submitted</h1>
      <p class="muted" style="margin:0">An admin will review your device shortly.</p>
    </div>

    <div class="card">
      <div class="card-body">
        <dl class="kv">
          <dt>Device</dt>
          <dd>My desktop · Windows laptop</dd>
          <dt>MAC</dt>
          <dd><code>f0:20:ff:e8:0f:ad</code></dd>
          <dt>Submitted</dt>
          <dd>2 minutes ago</dd>
          <dt>Status</dt>
          <dd><span class="pill pill-pending">Pending</span></dd>
        </dl>

        <p style="margin:24px 0 0;color:var(--text-muted);font-size:0.9em;text-align:center">
          <span class="live-dot"></span>
          This page will update automatically when reviewed.
        </p>
      </div>
    </div>

    <p class="muted" style="text-align:center;font-size:0.85em;margin-top:20px">
      You can close this page — your device will reconnect automatically once approved.
    </p>
  </div>
</body>
</html>
