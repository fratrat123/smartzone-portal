<header class="topbar">
  <div class="brand">
    {% if logo_url %}
      <img src="{{ logo_url }}" alt="" class="brand-logo">
    {% else %}
      <span class="brand-mark">{{ brand_mark }}</span>
    {% endif %}
    {{ brand_name }}
  </div>
  <nav>
    <a href="{{ url_for('admin.queue') }}" class="{{ 'active' if active == 'queue' else '' }}">Queue</a>
    <a href="{{ url_for('admin.devices') }}" class="{{ 'active' if active == 'devices' else '' }}">Devices</a>
    <a href="{{ url_for('admin.audit_view') }}" class="{{ 'active' if active == 'audit' else '' }}">Audit log</a>
    <a href="{{ url_for('admin.admins') }}" class="{{ 'active' if active == 'admins' else '' }}">Admins</a>
    <a href="{{ url_for('admin.smartzone_config') }}" class="{{ 'active' if active == 'smartzone' else '' }}">SmartZone</a>
  </nav>
  <div class="user">
    <div class="avatar">{{ (user.email[:2]|upper) if user else '' }}</div>
    <span>{{ user.email if user else '' }}</span>
    <a href="{{ url_for('portal.oauth_logout') }}" class="muted" style="margin-left:8px">Sign out</a>
  </div>
</header>
